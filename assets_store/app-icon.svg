<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5C42"/>
      <stop offset="1" stop-color="#159268"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1F8A5B"/>
      <stop offset="1" stop-color="#6BD59B"/>
    </linearGradient>
    <linearGradient id="fork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC23D"/>
      <stop offset="1" stop-color="#F08200"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#032B1D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- anel de progresso -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="18"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#A7F3D0" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="905 300"
          transform="rotate(-118 256 256)"/>

  <!-- prato -->
  <circle cx="256" cy="268" r="126" fill="#F7FFF9" filter="url(#soft)"/>
  <circle cx="256" cy="268" r="101" fill="none" stroke="#D9EDE0" stroke-width="3"/>

  <!-- folha que forma a colher -->
  <path d="M205 330 C196 268 231 215 311 196 C321 264 289 316 224 336 Z"
        fill="url(#leaf)" filter="url(#soft)"/>
  <path d="M211 326 C245 292 275 254 305 205" fill="none" stroke="#E9FFF2"
        stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M251 286 C265 286 279 277 288 263" fill="none" stroke="#E9FFF2"
        stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M230 307 C242 309 255 305 264 296" fill="none" stroke="#E9FFF2"
        stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- garfo -->
  <path d="M313 190 L313 304" stroke="url(#fork)" stroke-width="17" stroke-linecap="round"/>
  <path d="M291 190 L291 222" stroke="url(#fork)" stroke-width="11" stroke-linecap="round"/>
  <path d="M313 186 L313 222" stroke="url(#fork)" stroke-width="11" stroke-linecap="round"/>
  <path d="M335 190 L335 222" stroke="url(#fork)" stroke-width="11" stroke-linecap="round"/>
  <path d="M291 222 Q313 238 335 222" fill="none" stroke="url(#fork)" stroke-width="11" stroke-linecap="round"/>

  <!-- brilho -->
  <circle cx="176" cy="176" r="10" fill="#FFFFFF" fill-opacity="0.28"/>
  <circle cx="352" cy="360" r="6" fill="#FFFFFF" fill-opacity="0.22"/>
</svg>
