<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062D20"/>
      <stop offset="0.55" stop-color="#0B5C42"/>
      <stop offset="1" stop-color="#159268"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1F8A5B"/>
      <stop offset="1" stop-color="#6BD59B"/>
    </linearGradient>
    <linearGradient id="fork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC23D"/>
      <stop offset="1" stop-color="#F08200"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001B10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="930" cy="40" r="220" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="90" cy="470" r="180" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="690" cy="430" r="110" fill="#A7F3D0" fill-opacity="0.05"/>

  <!-- marca -->
  <g transform="translate(46,46)">
    <rect width="408" height="408" rx="88" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="204" cy="204" r="150" fill="none" stroke="#A7F3D0" stroke-opacity="0.5" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="700 240" transform="rotate(-118 204 204)"/>
    <circle cx="204" cy="214" r="100" fill="#F7FFF9" filter="url(#soft)"/>
    <circle cx="204" cy="214" r="80" fill="none" stroke="#D9EDE0" stroke-width="3"/>
    <path d="M160 263 C153 214 184 175 248 160 C256 215 230 253 176 268 Z" fill="url(#leaf)"/>
    <path d="M165 260 C193 232 216 203 243 168" fill="none" stroke="#E9FFF2" stroke-width="4" stroke-linecap="round"/>
    <path d="M250 152 L250 240" stroke="url(#fork)" stroke-width="13" stroke-linecap="round"/>
    <path d="M232 152 L232 178" stroke="url(#fork)" stroke-width="9" stroke-linecap="round"/>
    <path d="M250 149 L250 178" stroke="url(#fork)" stroke-width="9" stroke-linecap="round"/>
    <path d="M268 152 L268 178" stroke="url(#fork)" stroke-width="9" stroke-linecap="round"/>
    <path d="M232 178 Q250 190 268 178" fill="none" stroke="url(#fork)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- texto -->
  <text x="512" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF">Ai que fome</text>
  <text x="516" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#BFF3D6">Seu diário alimentar brasileiro</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="516" y="306" width="180" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="542" y="336" fill="#FFFFFF">TACO + Suplementos</text>
    <rect x="710" y="306" width="150" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="736" y="336" fill="#FFFFFF">Dobras J-P</text>
    <rect x="874" y="306" width="106" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="900" y="336" fill="#FFFFFF">Offline</text>
  </g>

  <text x="516" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#A7F3D0">Registre refeições, metas e composição corporal com segurança.</text>
</svg>
